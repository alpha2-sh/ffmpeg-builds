# Independent shared SDK release line. This workflow does not call or
# modify the existing static ffmpeg/ffprobe build pipeline.
name: Build FFmpeg shared SDK (LGPL)

on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: "FFmpeg release tag to build"
        required: true
        type: choice
        options:
          - "n8.1.3"
          - "n9.0.1"
          - "n8.0.3"
        default: "n8.1.3"
      draft_release:
        description: "Create the GitHub Release as a draft"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare shared SDK metadata
    runs-on: ubuntu-latest
    outputs:
      ffmpeg_tag: ${{ steps.meta.outputs.ffmpeg_tag }}
      version: ${{ steps.meta.outputs.version }}
      source_sha256: ${{ steps.meta.outputs.source_sha256 }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: Compute independent release tag
        id: meta
        env:
          FFMPEG_VERSION_INPUT: ${{ inputs.ffmpeg_version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          ffmpeg_tag="$FFMPEG_VERSION_INPUT"
          case "$ffmpeg_tag" in
            n8.0.3) source_sha256="6136812ea6d4e68bdba27e33c2a94382711cdf4f8602ffef056ff792bd6f9818" ;;
            n8.1.3) source_sha256="7138d28c96d9d3e3af4ee3d8cad72741f8ffb40da90c1112235dea3ecd3178a3" ;;
            n9.0.1) source_sha256="cf38e0e28c7e5605942c4a77755349b0145804a397af37eb1fb4c77cb237f635" ;;
            *) echo "unsupported FFmpeg tag: $ffmpeg_tag" >&2; exit 1 ;;
          esac
          version="${ffmpeg_tag#n}"
          {
            echo "ffmpeg_tag=$ffmpeg_tag"
            echo "version=$version"
            echo "source_sha256=$source_sha256"
            echo "release_tag=ffmpeg-${version}-shared-build${RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build shared SDK ${{ matrix.platform }}-${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            arch: x64
            runner: windows-latest
            container: ""
            shell: "msys2 {0}"
            archive: zip
          - platform: linux
            arch: x64
            runner: ubuntu-latest
            container: "ubuntu:22.04"
            shell: bash
            archive: tar.gz
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            container: "ubuntu:22.04"
            shell: bash
            archive: tar.gz
          - platform: macos
            arch: arm64
            runner: macos-latest
            container: ""
            shell: bash
            archive: tar.gz

    env:
      FFMPEG_TAG: ${{ needs.prepare.outputs.ffmpeg_tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      ASSET_BASE: ffmpeg-${{ needs.prepare.outputs.version }}-shared-${{ matrix.platform }}-${{ matrix.arch }}

    steps:
      - name: Bootstrap Linux container
        if: matrix.container != ''
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git curl xz-utils
          git config --global --add safe.directory '*'

      - name: Checkout build scripts
        uses: actions/checkout@v7

      - name: Set up MSYS2 toolchain
        if: matrix.platform == 'win'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git

      - name: Install build tools
        run: bash scripts/install-build-tools.sh

      - name: Build pinned SDK dependencies
        run: bash scripts/build-shared-sdk-deps.sh

      - name: Build shared SDK
        run: bash scripts/build-shared-sdk.sh

      - name: Verify ABI and LGPL policy
        run: bash scripts/verify-shared-sdk.sh

      - name: Package shared SDK
        run: bash scripts/package-shared-sdk.sh

      - name: Upload SDK output
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET_BASE }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/${{ env.ASSET_BASE }}.${{ matrix.archive }}
            dist/${{ env.ASSET_BASE }}.configure.txt

  release:
    name: Publish shared SDK release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v7

      - name: Download all SDK artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Download and verify matching FFmpeg source
        working-directory: artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA256: ${{ needs.prepare.outputs.source_sha256 }}
          SIGNING_KEY_FINGERPRINT: FCF986EA15E6E293A5644F10B4322F04D67658D8
        run: |
          set -euo pipefail
          archive="ffmpeg-${VERSION}.tar.xz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://ffmpeg.org/releases/$archive"
          curl --fail --location --retry 3 --output "$archive.asc" \
            "https://ffmpeg.org/releases/$archive.asc"
          curl --fail --location --retry 3 --output ffmpeg-devel.asc \
            https://ffmpeg.org/ffmpeg-devel.asc
          echo "$SOURCE_SHA256  $archive" | sha256sum --check --strict
          fingerprint="$(gpg --batch --show-keys --with-colons ffmpeg-devel.asc \
            | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$fingerprint" = "$SIGNING_KEY_FINGERPRINT"
          gpg --batch --yes --dearmor --output ffmpeg-release-key.gpg ffmpeg-devel.asc
          gpgv --keyring ./ffmpeg-release-key.gpg \
            "$archive.asc" "$archive"
          rm ffmpeg-release-key.gpg

      # The upstream fixes backported onto this release are part of its
      # corresponding source, so they ship beside the upstream tarball.
      # A release without patches uploads no patch asset, and the upload's
      # fail_on_unmatched_files would reject an unmatched glob.
      - name: Copy backported patches
        id: patches
        env:
          FFMPEG_TAG: ${{ needs.prepare.outputs.ffmpeg_tag }}
        run: |
          set -euo pipefail
          if [ -d "patches/$FFMPEG_TAG" ]; then
            cp "patches/$FFMPEG_TAG"/*.patch artifacts/
            echo "files=artifacts/*.patch" >> "$GITHUB_OUTPUT"
          else
            echo "files=" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate checksums
        working-directory: artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          sha256sum -- *.zip *.tar.gz *.configure.txt "ffmpeg-${VERSION}.tar.xz" \
            "ffmpeg-${VERSION}.tar.xz.asc" ffmpeg-devel.asc *.patch \
            > checksums.sha256
          cat checksums.sha256

      - name: Generate release notes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          FFMPEG_TAG="${{ needs.prepare.outputs.ffmpeg_tag }}" \
            bash scripts/release-notes-shared-sdk.sh \
            "${{ needs.prepare.outputs.version }}" \
            "${{ needs.prepare.outputs.release_tag }}" \
            artifacts > release-notes.md
          cat release-notes.md

      - name: Create shared SDK release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: FFmpeg ${{ needs.prepare.outputs.version }} shared SDK - build ${{ github.run_number }}
          body_path: release-notes.md
          draft: ${{ inputs.draft_release }}
          fail_on_unmatched_files: true
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.configure.txt
            artifacts/ffmpeg-${{ needs.prepare.outputs.version }}.tar.xz
            artifacts/ffmpeg-${{ needs.prepare.outputs.version }}.tar.xz.asc
            artifacts/ffmpeg-devel.asc
            artifacts/checksums.sha256
            ${{ steps.patches.outputs.files }}
